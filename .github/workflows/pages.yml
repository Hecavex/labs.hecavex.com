name: Deploy Labs to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate generated content and static site
        shell: bash
        run: |
          python scripts/build_attack_content.py
          git diff --exit-code -- data/attack
          python scripts/validate.py
          for file in assets/*.js; do node --check "$file"; done

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Stage public site
        if: github.event_name != 'pull_request'
        env:
          HECAVEX_ANALYTICS_TOKEN: ${{ vars.HECAVEX_ANALYTICS_TOKEN }}
        shell: bash
        run: |
          mkdir _site
          cp index.html CNAME .nojekyll robots.txt sitemap.xml LICENSE.md _site/
          cp -R .well-known assets attack-map baltic-threat-atlas data osint-workbench pivot-graph _site/
          if [ -n "$HECAVEX_ANALYTICS_TOKEN" ]; then
            find _site -name '*.html' -type f -exec sed -i "s/__HECAVEX_ANALYTICS_TOKEN__/$HECAVEX_ANALYTICS_TOKEN/g" {} +
          else
            find _site -name '*.html' -type f -exec sed -i '/<meta name="hecavex-measurement-token"/d' {} +
          fi
          ! grep -R "__HECAVEX_ANALYTICS_TOKEN__" _site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
