name: Deploy Labs to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_digest: ${{ steps.release.outputs.digest }}
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Read reviewed upstream revision
        id: upstream
        run: |
          python - <<'PY'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + json.load(open('scripts/upstream-release.json'))['revision'] + '\n')
          PY

      - name: Check out pinned APT Notes source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Hecavex/apt.hecavex.com
          ref: ${{ steps.upstream.outputs.revision }}
          path: .codex-tmp/upstream-apt
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Build exact upstream data release
        working-directory: .codex-tmp/upstream-apt
        run: |
          npm ci
          npm run build

      - name: Validate generated content and static site
        shell: bash
        env:
          APT_NOTES_DIST: .codex-tmp/upstream-apt/dist
        run: |
          python scripts/sync_shell.py --check
          python scripts/sync_atlas_context.py --check --apt-dist .codex-tmp/upstream-apt/dist
          python scripts/build_reviewed_attack_evidence.py --check --require-source --apt-dist .codex-tmp/upstream-apt/dist
          python scripts/check_upstream_contract.py --require-revision --apt-dist .codex-tmp/upstream-apt/dist
          git diff --exit-code -- data/attack
          python scripts/validate.py
          python scripts/audit_performance.py
          python scripts/test_provenance.py
          python scripts/test_analytical_contract.py
          python scripts/test_evidence_context.py
          node scripts/test_evidence_export.js
          node scripts/test_analytical_exercise.js
          node scripts/test_atlas_initial_query.js
          node scripts/test_pivot_race.js
          node scripts/test_copied_view.js
          for file in assets/*.js; do node --check "$file"; done

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Stage public site
        shell: bash
        env:
          HECAVEX_ANALYTICS_TOKEN: ${{ vars.HECAVEX_ANALYTICS_TOKEN }}
        run: |
          mkdir _site
          cp index.html 404.html CNAME robots.txt llms.txt sitemap.xml LICENSE LICENSE.md DATA-LICENSE.md favicon.svg favicon.ico apple-touch-icon.png icon-192.png icon-512.png site.webmanifest _site/
          cp -R .well-known about assets attack-map baltic-threat-atlas changes licence lt methodology osint-workbench pivot-graph security _site/
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/stage_public_data.py _site
          else
            python scripts/stage_public_data.py _site --require-analytics
          fi
          node scripts/apply-csp.mjs _site

      - name: Install bounded browser smoke dependency
        run: npm install --prefix .browser-check --no-save --package-lock=false playwright-core@1.62.1
      - name: Test staged data interaction and CSP in Chrome
        run: node scripts/smoke-release.mjs _site labs
      - name: Record publication manifest
        id: release
        run: node scripts/release.mjs create _site labs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out release verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify live revision and artifact hashes
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.release_digest }}
        run: node scripts/release.mjs verify https://labs.hecavex.com/ "$EXPECTED_DIGEST" "$GITHUB_SHA"
      - name: Install bounded browser smoke dependency
        run: npm install --prefix .browser-check --no-save --package-lock=false playwright-core@1.62.1
      - name: Verify live data interaction
        run: node scripts/smoke-release.mjs https://labs.hecavex.com/ labs
