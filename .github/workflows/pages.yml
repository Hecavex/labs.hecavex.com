name: Deploy Labs to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate static site
        run: python scripts/validate.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Stage public site
        if: github.event_name != 'pull_request'
        env:
          HECAVEX_ANALYTICS_TOKEN: ${{ vars.HECAVEX_ANALYTICS_TOKEN }}
        shell: bash
        run: |
          mkdir _site
          cp index.html CNAME .nojekyll robots.txt sitemap.xml LICENSE.md _site/
          cp -R .well-known assets baltic-threat-atlas data osint-workbench pivot-graph _site/
          if [ -n "$HECAVEX_ANALYTICS_TOKEN" ]; then
            find _site -name '*.html' -type f -exec sed -i "s/__HECAVEX_ANALYTICS_TOKEN__/$HECAVEX_ANALYTICS_TOKEN/g" {} +
          else
            find _site -name '*.html' -type f -exec sed -i '/<meta name="hecavex-measurement-token"/d' {} +
          fi
          ! grep -R "__HECAVEX_ANALYTICS_TOKEN__" _site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
