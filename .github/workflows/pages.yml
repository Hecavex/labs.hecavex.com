name: Deploy Labs to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate generated content and static site
        shell: bash
        run: |
          python scripts/sync_shell.py --check
          python scripts/build_reviewed_attack_evidence.py --check
          git diff --exit-code -- data/attack
          python scripts/validate.py
          python scripts/audit_performance.py
          node scripts/test_atlas_initial_query.js
          for file in assets/*.js; do node --check "$file"; done

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Stage public site
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HECAVEX_ANALYTICS_TOKEN: ${{ vars.HECAVEX_ANALYTICS_TOKEN }}
        run: |
          mkdir _site
          cp index.html CNAME robots.txt llms.txt sitemap.xml LICENSE LICENSE.md DATA-LICENSE.md favicon.svg favicon.ico apple-touch-icon.png icon-192.png icon-512.png site.webmanifest _site/
          cp -R .well-known about assets attack-map baltic-threat-atlas changes licence methodology osint-workbench pivot-graph security _site/
          python scripts/stage_public_data.py _site --require-analytics

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
